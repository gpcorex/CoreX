name: Centro Multimedia Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "media/android/CentroMultimedia/**"
      - ".github/workflows/centro-multimedia-android.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for candidate in             "$SDKROOT/cmdline-tools/latest/bin/sdkmanager"             "$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"             "$SDKROOT/cmdline-tools/12.0/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            find "$SDKROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: media/android/CentroMultimedia
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp media/android/CentroMultimedia/app/build/outputs/apk/debug/app-debug.apk dist/CentroMultimedia-v0.1.0-debug.apk
          sha256sum dist/CentroMultimedia-v0.1.0-debug.apk > dist/CentroMultimedia-v0.1.0-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentroMultimedia-debug-apk
          path: |
            dist/CentroMultimedia-v0.1.0-debug.apk
            dist/CentroMultimedia-v0.1.0-debug.sha256
          if-no-files-found: error
          retention-days: 30
